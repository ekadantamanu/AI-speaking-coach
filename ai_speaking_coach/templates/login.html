<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Speaking Coach -- Sign in</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <main class="container login-container">
    <h1>🎤 AI Speaking Coach</h1>
    <p>This instance is password-protected -- private to you.</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" class="panel">
      <input type="password" name="password" placeholder="Password" autofocus required
             style="width:100%; padding:10px; font-size:16px; margin-bottom:12px; border:1px solid #e5e7eb; border-radius:8px;">
      <button type="submit" class="primary" style="width:100%;">Enter</button>
    </form>
  </main>
</body>
</html>
